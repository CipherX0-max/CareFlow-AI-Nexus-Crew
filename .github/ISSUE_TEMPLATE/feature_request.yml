name: Feature Request
description: Suggest an idea or enhancement for CareFlow AI
title: "[FEATURE] <title>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for proposing a feature or improvement!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or capability you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered.
    validations:
      required: false
